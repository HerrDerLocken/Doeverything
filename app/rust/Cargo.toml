[package]
name = "rust_lib_doeverything"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
doeverything-core = { version = "0.1.0", path = "../../crates/core" }
doeverything-store = { version = "0.1.0", path = "../../crates/store", features = ["sqlcipher"] }
flutter_rust_bridge = "=2.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

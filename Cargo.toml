[workspace]
resolver = "3"
members = ["crates/core", "crates/proto", "crates/server", "crates/store", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/HerrDerLocken/Doeverything"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
